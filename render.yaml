services:
  - type: web
    name: codebattle-arena
    runtime: node
    plan: free
    rootDir: v2.0
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: MONGO_DB_URL
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_SIGN_IN_URL
        value: /public/Accounts/signin.html
      - key: CLERK_SIGN_UP_URL
        value: /public/Accounts/signup.html
