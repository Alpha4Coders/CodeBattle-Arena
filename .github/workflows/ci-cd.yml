name: CodeBattle Arena Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ========================================================
  # STAGE 1: PR & Commit Metadata Validation
  # ========================================================
  metadata-validation:
    name: 📝 Commit & PR Metadata Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Commit Message Format
        if: github.event_name == 'push'
        run: |
          echo "🔍 Checking commit message convention..."
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          echo "Head Commit Message: $COMMIT_MSG"
          
          # Regex for Conventional Commits with scope: feat(frontend): ..., fix(backend): ...
          CONVENTIONAL_REGEX="^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9_-]+\))?: .+"
          
          if [[ ! "$COMMIT_MSG" =~ $CONVENTIONAL_REGEX ]]; then
            echo "⚠️ Warning: Commit message does not strictly follow conventional commits (e.g. feat(frontend): description)"
            echo "Encouraged format: <type>(<scope>): <summary>"
          else
            echo "✅ Commit message follows conventional format."
          fi

      - name: Verify PR Description Checklist
        if: github.event_name == 'pull_request'
        run: |
          echo "🔍 Checking Pull Request description..."
          PR_BODY="${{ github.event.pull_request.body }}"
          
          # Check for key component declarations (Frontend, Backend, System/DevOps)
          echo "Checking component impact declarations..."
          if [[ "$PR_BODY" =~ "Frontend" ]] || [[ "$PR_BODY" =~ "Backend" ]] || [[ "$PR_BODY" =~ "System" ]] || [[ "$PR_BODY" =~ "Aptitude" ]]; then
            echo "✅ Component updates properly specified in PR description."
          else
            echo "ℹ️ Notice: Please ensure your PR description specifies affected components (Frontend/Backend/System)."
          fi

  # ========================================================
  # STAGE 2: Code Quality & Syntax Verification
  # ========================================================
  code-quality:
    name: 🔍 Syntax & Code Quality Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2.0
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: v2.0/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Validate Server Syntax
        run: |
          echo "🔍 Validating core server files syntax..."
          node -c server/index.js
          node -c server/database.js
          node -c server/arenaSocket.js
          node -c server/arenaDatabase.js
          node -c server/aptitudeDatabase.js
          node -c server/seedAptitude.js
          node -c server/testAptitude.js
          echo "✅ All core server files passed syntax checks."

      - name: Code Quality & Lint Scan
        run: |
          echo "🔍 Running linter..."
          npm run lint || echo "⚠️ Non-critical lint warnings noted."
        continue-on-error: true

  # ========================================================
  # STAGE 3: Unit & Integration Test Suites
  # ========================================================
  test-suites:
    name: 🧪 Automated Test Suites
    runs-on: ubuntu-latest
    needs: [code-quality]
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        node-version: ['20.x', '22.x']

    defaults:
      run:
        working-directory: v2.0

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: v2.0/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Aptitude & System Test Suites
        env:
          MONGO_DB_URL: mongodb://localhost:27017/codebattle-arena-test
          NODE_ENV: test
        run: |
          echo "🧪 Running Aptitude Arena 10-step SDE test suite..."
          node server/testAptitude.js
          echo "✅ Aptitude test suite passed."

  # ========================================================
  # STAGE 4: Full System Integration & Health Checks
  # ========================================================
  system-health-check:
    name: 🌐 System End-to-End API Health Check
    runs-on: ubuntu-latest
    needs: [test-suites]
    defaults:
      run:
        working-directory: v2.0

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: v2.0/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Start Express Server in Background
        env:
          PORT: 8080
          NODE_ENV: production
          MONGO_DB_URL: mongodb://localhost:27017/codebattle-arena
        run: |
          echo "🚀 Booting up CodeBattle Arena Express server..."
          node server/index.js &
          SERVER_PID=$!
          echo "Server started with PID: $SERVER_PID"
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
          sleep 5

      - name: Test Core & Aptitude Endpoints
        run: |
          echo "🔍 Probing /api/health..."
          curl -f http://localhost:8080/api/health || exit 1
          echo ""

          echo "🔍 Probing /api/aptitude/categories..."
          CATEGORIES_RES=$(curl -s http://localhost:8080/api/aptitude/categories)
          echo "$CATEGORIES_RES"
          echo "$CATEGORIES_RES" | grep -q "quantitative" || exit 1
          echo "✅ Categories endpoint verified."

          echo "🔍 Probing /api/aptitude/topics/quantitative..."
          TOPICS_RES=$(curl -s http://localhost:8080/api/aptitude/topics/quantitative)
          echo "$TOPICS_RES" | grep -q "speed-time-and-distance" || exit 1
          echo "✅ Quantitative topics verified."

          echo "🔍 Probing /api/aptitude/exam/speed-time-and-distance/practice/1 (Security check)..."
          EXAM_RES=$(curl -s http://localhost:8080/api/aptitude/exam/speed-time-and-distance/practice/1)
          if echo "$EXAM_RES" | grep -q "correctOption"; then
            echo "❌ CRITICAL SECURITY ERROR: correctOption leaked to client payload!"
            exit 1
          fi
          echo "✅ Zero answer-leakage security verified."

      - name: Gracefully Terminate Server
        if: always()
        run: |
          if [ -n "$SERVER_PID" ]; then
            echo "Shutting down test server PID $SERVER_PID..."
            kill $SERVER_PID || true
          fi

  # ========================================================
  # STAGE 5: Security & Dependency Vulnerability Audit
  # ========================================================
  security-audit:
    name: 🔒 Security & Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [code-quality]
    defaults:
      run:
        working-directory: v2.0
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Run NPM Security Audit
        run: |
          echo "🛡️ Scanning dependencies for critical vulnerabilities..."
          npm audit --audit-level=critical || echo "⚠️ Audit report completed with warnings."
        continue-on-error: true

  # ========================================================
  # STAGE 6: Production Deployment Gate
  # ========================================================
  deploy-production:
    name: 🚀 Production Deployment Gate
    runs-on: ubuntu-latest
    needs: [metadata-validation, code-quality, test-suites, system-health-check, security-audit]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Render Deploy Secrets
        id: check-secrets
        run: |
          if [ -n "${{ secrets.RENDER_SERVICE_ID }}" ] && [ -n "${{ secrets.RENDER_API_KEY }}" ]; then
            echo "has_secrets=true" >> $GITHUB_OUTPUT
          else
            echo "has_secrets=false" >> $GITHUB_OUTPUT
          fi

      - name: Trigger Render Production Deployment
        if: steps.check-secrets.outputs.has_secrets == 'true'
        uses: johnbeynon/render-deploy-action@v0.0.8
        with:
          service-id: ${{ secrets.RENDER_SERVICE_ID }}
          api-key: ${{ secrets.RENDER_API_KEY }}

      - name: Log Deployment Status
        run: |
          echo "=========================================================="
          echo "🎉 ALL SYSTEM CHECKS & TESTS PASSED SUCCESSFULLY!"
          echo "📦 Production Artifact Verified."
          echo "🚀 Commit: ${{ github.event.head_commit.message }}"
          echo "👤 Author: ${{ github.actor }}"
          echo "=========================================================="
